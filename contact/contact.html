<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div class="back-container">
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>

    <div class="contact-main">

        <h1>Contact <span class="span-element">Me</span></h1>
        <p>If you have any project or collaboration idea feel free to contact me.</p>

        <div class="contact-container">

            <form class="contact-form">

                <h2>Send Message</h2>

                <input type="text" placeholder="Your Name">

                <input type="email" placeholder="Your Email">

                <input type="text" placeholder="Subject">

                <textarea placeholder="Your Message"></textarea>

                <button type="button" class="send-btn" onclick="alert('Form Submitted!')">
                    Send Message
                </button>

            </form>


            <div class="contact-details">

                <h2>Contact Information</h2>

                <div class="contact-card">
                    <h3>Phone</h3>
                    <p>+91 9763362691</p>
                </div>

                <div class="contact-card">
                    <h3>Email</h3>
                    <p>punam.incubators@gmail.com</p>
                </div>

                <div class="contact-card">
                    <h3>Location</h3>
                    <p>Pune, Maharashtra</p>
                </div>

                <div class="social-links">

                    <h2>Social Media</h2>

                    <a href="#">LinkedIn</a>
                    <a href="#">GitHub</a>
                    <a href="#">Instagram</a>
                    <a href="#">Twitter</a>
                    <a href="#">Facebook</a>
                    <a href="#">YouTube</a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
